name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version

      - name: Build (records which unsafe blocks are unneeded)
        run: |
          set -o pipefail
          cargo build --release 2>&1 | tee build.log
          {
            echo "PhotoKit calls Rust treats as safe (unsafe block flagged as unnecessary):"
            grep -A3 "unnecessary \`unsafe\` block" build.log | grep -E "^\s+--> " | sed -E 's/^\s+--> /  /' || echo "  (none)"
            echo
            echo "unsafe blocks in src/: $(grep -c 'unsafe {' src/lib.rs src/edit.rs | tr '\\n' ' ')"
          } > unsafe-report.txt
          cat unsafe-report.txt

      - name: Package the three variants (ad-hoc signed)
        run: |
          mkdir -p dist/PhotoKitProbe.app/Contents/MacOS
          cp target/release/photokit-probe target/release/photokit-probe-plist target/release/photokit-edit dist/
          cp target/release/photokit-probe dist/PhotoKitProbe.app/Contents/MacOS/
          cp app/Info.plist dist/PhotoKitProbe.app/Contents/Info.plist
          codesign --force -s - dist/photokit-probe
          codesign --force -s - dist/photokit-probe-plist
          codesign --force -s - dist/photokit-edit
          codesign --force -s - dist/PhotoKitProbe.app
          codesign -dv dist/PhotoKitProbe.app 2>&1 | head -5
          otool -s __TEXT __info_plist dist/photokit-probe-plist | head -3
          cp unsafe-report.txt README.md dist/

      - name: Status without asking (no prompt on a runner)
        run: |
          dist/photokit-probe status || true
          dist/photokit-probe-plist status || true

      - uses: actions/upload-artifact@v4
        with:
          name: photokit-probe-${{ github.run_number }}
          path: |
            dist/
            Cargo.lock
          retention-days: 14
